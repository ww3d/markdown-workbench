name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      matrix:
        # The check name `build-test (<os>)` is canonical across the playbook
        # (docs/common/ci.md) - add a leg, never rename it.
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Reads the pnpm version from package.json's packageManager field; must
      # precede setup-node, whose pnpm cache needs the binary.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26 # maintainer order; the overlay still names 24 (ww3d/playbook#334)
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format check and lint
        shell: pwsh
        run: ./build.ps1 -Task Check
      - name: Tests with coverage gate
        shell: pwsh
        run: ./build.ps1 -Task Coverage
      - name: Package vsix
        shell: pwsh
        run: ./build.ps1 -Task Package
      # Output paths come from eng/layout.ts, never from a literal here.
      - name: Resolve output layout
        id: layout
        run: echo "packages=$(node eng/layout.ts packages)" >> "$GITHUB_OUTPUT"
      - name: Upload vsix artifact
        uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: ${{ steps.layout.outputs.packages }}/*.vsix
          if-no-files-found: error

  # Separate job, not extra steps in `build-test`: it must run only on a push
  # to main (never on pull_request, where a fork PR would otherwise be handed a
  # write token), and it needs elevated, scoped permissions that `build-test`
  # must not carry. It rebuilds the vsix so the attested + uploaded file is
  # exactly the one this job produced.
  release:
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and its tag
      id-token: write # Sigstore OIDC for build provenance
      attestations: write # write the provenance attestation
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Package vsix
        shell: pwsh
        run: ./build.ps1 -Task Package
      - name: Resolve version and vsix
        id: meta
        run: |
          version=$(node -p "require('./package.json').version")
          # Output paths come from eng/layout.ts, never from a literal here.
          packages=$(node eng/layout.ts packages)
          name="markdown-workbench-${version}.vsix"
          test -f "${packages}/${name}" || { echo "::error::expected ${packages}/${name}, not found"; exit 1; }
          mkdir -p "$(node eng/layout.ts tmp)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          echo "vsix=${packages}/${name}" >> "$GITHUB_OUTPUT"
          echo "notes=$(node eng/layout.ts tmp)/notes.md" >> "$GITHUB_OUTPUT"
      - name: Skip if the release tag already exists
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.meta.outputs.version }}"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists - skipping release (no version bump)."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build release notes
        if: steps.guard.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.meta.outputs.version }}"
          vsix="${{ steps.meta.outputs.name }}"
          notes="${{ steps.meta.outputs.notes }}"
          tag="v${version}"
          # 1. Curated CHANGELOG section for this version (fails if missing/empty).
          node scripts/release-notes.ts "$version" CHANGELOG.md "$notes"
          # 2. Install + attestation-verify block, right under the changelog so
          #    the two human-relevant parts sit together at the top.
          {
            echo ""
            echo "## Install"
            echo ""
            echo '```sh'
            echo "code --install-extension ${vsix}"
            echo "gh attestation verify ${vsix} --repo ${GITHUB_REPOSITORY}"
            echo '```'
          } >> "$notes"
          # 3. GitHub's auto-generated notes (PR list, contributors, compare
          #    link) fetched explicitly via the documented REST endpoint and
          #    appended - so notes.md is the complete, verifiable artifact and
          #    the curated-before-generated order is ours, not API behavior.
          #    Avoids the undocumented --notes-file + --generate-notes combo.
          {
            echo ""
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$tag" \
              -f target_commitish="${GITHUB_SHA}" \
              --jq .body
          } >> "$notes"
          # Surface the full notes in the run for inspection.
          cat "$notes" >> "$GITHUB_STEP_SUMMARY"
      - name: Generate checksums
        if: steps.guard.outputs.exists == 'false'
        # Hashed from inside the package folder: the line must name the bare
        # file, which is what publish.ps1 verifies against.
        working-directory: ${{ steps.meta.outputs.packages }}
        run: sha256sum "${{ steps.meta.outputs.name }}" > SHA256SUMS.txt
      - name: Attest build provenance
        if: steps.guard.outputs.exists == 'false'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.meta.outputs.vsix }}
      - name: Create GitHub release
        if: steps.guard.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.meta.outputs.version }}" \
            "${{ steps.meta.outputs.vsix }}" \
            "${{ steps.meta.outputs.packages }}/SHA256SUMS.txt" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "v${{ steps.meta.outputs.version }}" \
            --notes-file "${{ steps.meta.outputs.notes }}"
